[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arklink"
version = "0.12.0"
description = "QQ bot 运行时：收发消息 + 白名单 + 给上层调用的 HTTP/SDK（含 Milky / Satori 适配与 QQ NT 逆向工具）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "panxian-AI" }]
keywords = ["qq", "bot", "milky", "satori", "onebot", "arkbot", "protocol", "reverse-engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
]
dependencies = ["websockets>=12"]

[project.optional-dependencies]
test = ["pytest>=8"]
# 想把本包装进 ArkBot 跑全链路：pip install "arkbot @ git+https://github.com/panxian-AI/ArkBot"
framework = ["arkbot"]

[project.urls]
Homepage = "https://github.com/panxian-AI/ArkLink"
Repository = "https://github.com/panxian-AI/ArkLink"
Parent = "https://github.com/panxian-AI/ArkBot"

[project.scripts]
arklink = "arklink.__main__:main"

[project.entry-points."arkbot.adapters"]
# ArkBot 的加载器按这个名字查找；装上本包后 bot.toml 里直接写 type = "milky"
milky = "arklink.milky:create"
satori = "arklink.satori:create"
ntqq-native = "arklink.ntqq.native:create"
ntqq-client = "arklink.ntqq.host:create"

[tool.setuptools.packages.find]
include = ["arklink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
